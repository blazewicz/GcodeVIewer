[package]
name = "gcode-viewer-wasm"
description = "WebAssembly bindings for the G-code toolpath renderer"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[lib]
name = "gcode_viewer_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
gcode-viewer-renderer = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
wgpu = { workspace = true, default-features = false, features = [
    "std",
    "webgl",
    "webgpu",
    "wgsl",
] }

[lints]
workspace = true
