[package]
name = "gcode-viewer-renderer"
description = "wgpu renderer for G-code toolpaths"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
package-manager = "cargo"
root = "./src/shader"
include = ["src/shader/**/*.wesl"]

[dependencies]
gcode-viewer-gcode = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wesl-core = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, default-features = false, features = [
    "std",
    "webgl",
    "webgpu",
    "wgsl",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }

[build-dependencies]
naga = { workspace = true }
wesl = "0.6"

[dev-dependencies]
naga = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
