[workspace]
members = ["crates/gcode", "crates/renderer", "crates/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
gcode-viewer-gcode = { path = "crates/gcode" }
gcode-viewer-renderer = { path = "crates/renderer" }
glam = "0.34.1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
rayon = "1.11"
log = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
smallvec = "1"
indoc = "2"
rstest = "0.27"
thiserror = "2"
bytemuck = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wesl-core = "0.1"
wgpu = "30"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
