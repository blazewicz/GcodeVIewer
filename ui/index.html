    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GcodeViewer",
        "url": "https://blazewicz.github.io/GcodeVIewer/",
        "description": "Free browser-based G-code viewer. Inspect Marlin toolpaths with color-coded moves, feedrate coloring and Z clipping — files never leave your device.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires WebAssembly SIMD and WebGPU or WebGL 2",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "codeRepository": "https://github.com/blazewicz/GcodeVIewer",
        "license": "https://github.com/blazewicz/GcodeVIewer/blob/master/LICENSE",
        "screenshot": "https://blazewicz.github.io/GcodeVIewer/og.png"
      }
    </script>
  </head>
  <body>
    <canvas id="view" aria-label="G-code toolpath preview">Your browser does not support the canvas element.</canvas>
    <div id="zcontrol">
      <span id="zlabel" class="muted">Z</span>
      <input id="z" type="range" min="0" max="1" step="0.01" value="1" disabled />
    </div>
    <aside id="panel">
      <h1>GcodeViewer</h1>
      <p class="muted">Browser-based G-code toolpath preview</p>
      <noscript>
        <p class="muted">The viewer needs JavaScript and WebAssembly; enable both to preview toolpaths.</p>
      </noscript>

      <label class="button">
        Open G-code
        <input id="file" type="file" accept=".gcode,.nc,.txt" />
      </label>
      <button id="demo" type="button">Load demo</button>
      <button id="fit" type="button">Fit view</button>

      <div id="sliders" class="controls"></div>

      <p id="stats" class="muted">Drop a G-code file onto the canvas.</p>

      <div id="toggles" class="legend"></div>

      <div id="feed-legend" hidden>
        <span class="muted">Feedrate (mm/min)</span>
        <div id="feed-gradient"></div>
        <div class="feed-range">
          <input id="feed-min" type="number" step="any" aria-label="Lower feedrate bound" />
          <input id="feed-max" type="number" step="any" aria-label="Upper feedrate bound" />
        </div>
      </div>

      <div id="kinds" class="legend"></div>
      <p class="muted">Drag to pan, wheel to zoom, middle or ctrl/cmd+drag to orbit.</p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
